name: REA - Ghidra Cloud Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rea-ghidra-demo.yml'

permissions:
  contents: read

concurrency:
  group: rea-ghidra-demo
  cancel-in-progress: false

jobs:
  ghidra-demo:
    name: Install REA + Ghidra and analyze sample native binary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout configuration and scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install JDK 21 (Ghidra 12.1.4 requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify native host dependencies
        run: |
          set -Eeuo pipefail
          for c in ps curl unzip sha256sum gcc java javac timeout; do command -v "$c" >/dev/null; done
      - name: Install official pinned REA package
        run: |
          set -Eeuo pipefail
          npm install --global --no-audit --no-fund rea-agents@6.8.0
          rea --version
      - name: Download and verify official Ghidra release
        run: bash scripts/install-ghidra.sh
      - name: Build harmless sample binary
        run: |
          set -Eeuo pipefail
          mkdir -p input reports
          cat > input/sample.c <<'SOURCE'
          #include <stdio.h>
          int fxga_sum(int a, int b) { return a+b; }
          int main(void) { printf("REA demo: %d\n", fxga_sum(8, 4)); return 0; }
          SOURCE
          gcc -O0 -g -fno-pie -no-pie -o input/rea-demo input/sample.c
          file input/rea-demo
      - name: REA Ghidra readiness and analysis
        run: |
          set -Eeuo pipefail
          rea --version | tee reports/rea-version.txt
          timeout -k 10s 2m rea doctor --provider ghidra --json | tee reports/ghidra-doctor.json
          timeout -k 10s 8m rea inspect "$GITHUB_WORKSPACE/input/rea-demo" --provider ghidra --json > reports/rea-native-overview.json
          test -s reports/rea-native-overview.json
          echo 'REA native overview written to reports/rea-native-overview.json'
      - name: Upload demo reports (public-safe test only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-ghidra-demo-results
          path: reports/
          retention-days: 1
          if-no-files-found: ignore
  publish-public-report:
    name: Publish only the harmless sample Ghidra results
    needs: ghidra-demo
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout public reports branch
        uses: actions/checkout@v4
      - name: Retrieve the generated demo report
        uses: actions/download-artifact@v4
        with:
          name: rea-ghidra-demo-results
          path: tmp/reports
      - name: Write public report and retain only latest ten
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git switch -C main origin/main
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const id = Number(process.env.GITHUB_RUN_ID);
          if (!Number.isSafeInteger(id) || id <= 0) throw Error('Invalid run ID');
          const src = 'tmp/reports/rea-native-overview.json';
          const data = JSON.parse(fs.readFileSync(src, 'utf8'));
          const dest = 'public/reports';
          fs.mkdirSync(dest, { recursive: true });
          const record = {
            kind: 'fxga-rea-ghidra-demo',
            run_id: id,
            repository: 'geetechenterpriseai/REA',
            source: 'official REA + Ghidra generated sample executable',
            published_at: new Date().toISOString(),
            run_url: 'https://github.com/geetechenterpriseai/REA/actions/runs/' + id,
            note: 'Public demonstration only. No private files were analyzed.',
            excerpt: JSON.stringify(data).slice(0, 12000),
          };
          const payload = JSON.stringify(record, null, 2) + '\n';
          fs.writeFileSync(path.join(dest, id + '.json'), payload);
          fs.writeFileSync(path.join(dest, 'latest.json'), payload);
          const ids = fs.readdirSync(dest).filter(x => /^\d+\.json$/.test(x)).sort((a,b) => Number(a.slice(0,-5))-Number(b.slice(0,-5)));
          for (const name of ids.slice(0, -10)) fs.unlinkSync(path.join(dest, name));
          const retained = fs.readdirSync(dest).filter(x => /^\d+\.json$/.test(x)).sort((a,b)=>Number(b.slice(0,-5))-Number(a.slice(0,-5)));
          const index = {
            kind: 'fxga-rea-ghidra-demo-index',
            repository: 'geetechenterpriseai/REA',
            updated_at: new Date().toISOString(),
            runs: retained.map(name => {
              const item = JSON.parse(fs.readFileSync(path.join(dest,name),'utf8'));
              return { id: item.run_id, name: 'REA - Ghidra Cloud Demo', status: 'completed', conclusion: 'success', published_at: item.published_at, url: item.run_url };
            }),
          };
          fs.writeFileSync(path.join(dest, 'index.json'), JSON.stringify(index, null, 2) + '\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish safe REA Ghidra demo result from run ${{ github.run_id }}'
          git push origin HEAD:main
