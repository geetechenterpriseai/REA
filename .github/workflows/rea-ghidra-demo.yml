name: REA - Ghidra Cloud Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rea-ghidra-demo.yml'

permissions:
  contents: read

concurrency:
  group: rea-ghidra-demo
  cancel-in-progress: false

jobs:
  ghidra-demo:
    name: Install REA + Ghidra and analyze sample native binary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout configuration and scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install JDK 21 (Ghidra 12.1.4 requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify native host dependencies
        run: |
          set -Eeuo pipefail
          for c in ps curl unzip sha256sum gcc java javac timeout; do command -v "$c" >/dev/null; done
      - name: Install official pinned REA package
        run: |
          set -Eeuo pipefail
          npm install --global --no-audit --no-fund rea-agents@6.8.0
          rea --version
      - name: Download and verify official Ghidra release
        run: bash scripts/install-ghidra.sh
      - name: Build harmless sample binary
        run: |
          set -Eeuo pipefail
          mkdir -p input reports
          cat > input/sample.c <<'SOURCE'
          #include <stdio.h>
          int fxga_sum(int a, int b) { return a+b; }
          int main(void) { printf("REA demo: %d\n", fxga_sum(8, 4)); return 0; }
          SOURCE
          gcc -O0 -g -fno-pie -no-pie -o input/rea-demo input/sample.c
          file input/rea-demo
      - name: REA Ghidra readiness and analysis
        run: |
          set -Eeuo pipefail
          rea --version | tee reports/rea-version.txt
          timeout -k 10s 2m rea doctor --provider ghidra --json | tee reports/ghidra-doctor.json
          timeout -k 10s 8m rea inspect "$GITHUB_WORKSPACE/input/rea-demo" --provider ghidra --json > reports/rea-native-overview.json
          test -s reports/rea-native-overview.json
          echo 'REA native overview written to reports/rea-native-overview.json'
      - name: Publish demo-only analysis summary to Cloudflare
        if: success()
        env:
          REA_CALLBACK_TOKEN: ${{ secrets.REA_CALLBACK_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${REA_CALLBACK_TOKEN:-}" ]; then
            echo "Cloudflare callback disabled (repository secret REA_CALLBACK_TOKEN is missing)"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const overview = JSON.parse(readFileSync('reports/rea-native-overview.json', 'utf8'));
          const payload = {
            kind: 'fxga-rea-ghidra-demo',
            run_id: Number(process.env.GITHUB_RUN_ID),
            excerpt: JSON.stringify(overview).slice(0, 12000)
          };
          writeFileSync('reports/cloudflare-callback.json', JSON.stringify(payload));
          NODE
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 2 \
            -X POST \
            -H "Authorization: Bearer ${REA_CALLBACK_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @reports/cloudflare-callback.json \
            "https://fxga-rea-cloud-mcp.few-nose.workers.dev/reports/upload"
      - name: Upload demo reports (public-safe test only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-ghidra-demo-results
          path: reports/
          retention-days: 1
          if-no-files-found: ignore
