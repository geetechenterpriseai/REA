name: REA - Cloudflare MCP Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker.mjs'
      - 'cloudflare/worker.test.mjs'
      - '.github/workflows/rea-cloudflare-tests.yml'

permissions:
  contents: read

concurrency:
  group: rea-cloudflare-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Validate and test gateway
        run: |
          set -Eeuo pipefail
          node --check cloudflare/worker.mjs
          node --test cloudflare/worker.test.mjs
          echo 'Public MCP unit tests completed'
      - name: Smoke-test live Cloudflare endpoint
        run: |
          set -Eeuo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 20 \
            "https://fxga-rea-cloud-mcp.few-nose.workers.dev/health" > health.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          if (h.service !== 'fxga-rea-cloud-mcp' || h.status !== 'public_read_only') {
            throw new Error('Unexpected Cloudflare gateway health');
          }
          console.log('Cloudflare live health passed; access state:', h.status);
          NODE
          status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --max-time 20 \
            -o response.json -w "%{http_code}" -X POST -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            "https://fxga-rea-cloud-mcp.few-nose.workers.dev/mcp")
          if [[ "$status" != "200" ]]; then
            echo "Expected anonymous MCP tools/list HTTP 200, got HTTP $status"
            cat response.json
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rpc = JSON.parse(fs.readFileSync('response.json', 'utf8'));
          const names = rpc.result?.tools?.map(x=>x.name) || [];
          if (names.length !== 5 || names.some(x => x === 'rea_start_ghidra_demo')) throw new Error('Public MCP tool allowlist is incorrect');
          console.log('Cloudflare public MCP tools/list passed:', names.join(', '));
          NODE
      - name: Check anonymous Github status and published report tools
        run: |
          set -Eeuo pipefail
          for tool in rea_list_runs rea_get_latest_report; do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 20 \
              -X POST -H "Content-Type: application/json" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\"params\":{\"name\":\"${tool}\",\"arguments\":{}}}" \
              "https://fxga-rea-cloud-mcp.few-nose.workers.dev/mcp" > "check-${tool}.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = name => {
            const result = JSON.parse(fs.readFileSync('check-' + name + '.json','utf8')).result;
            if (result?.isError !== false || !result.content?.[0]?.text) throw new Error(name + ' reported an MCP error: ' + JSON.stringify(result).slice(0,600));
            return JSON.parse(result.content[0].text);
          };
          const runs = read('rea_list_runs');
          if (!Array.isArray(runs.runs)) throw new Error('GitHub runs response is invalid');
          const report = read('rea_get_latest_report');
          if (report.kind !== 'fxga-rea-ghidra-demo' || !Number.isInteger(report.run_id)) throw new Error('Public REA report was unavailable');
          console.log('Anonymous Cloudflare GitHub API: OK; latest published report run', report.run_id);
          NODE
